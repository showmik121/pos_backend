# প্রতিটি push (যেকোনো branch) ও pull request এ চলে। হাতে চালাতে: Actions ট্যাব -> CI -> "Run workflow"।
# main এ push হলে সব যাচাই পাস করার পর API নিজে থেকে Supabase এ ডিপ্লয় হয়।
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# একই branch এ নতুন push এলে পুরনো, চলতে থাকা যাচাই বাতিল হয়।
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (no database needed)
        run: npm run test:unit

  postgres:
    name: Postgres integration (migrations, RLS, sync)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # এই ডাটাবেস শুধু এই জবের জন্য, প্রতিবার নতুন। এসব আসল পাসওয়ার্ড নয়।
      DATABASE_URL_UNPOOLED: postgres://postgres:ci-admin-password@localhost:5432/pos
      POS_APP_PASSWORD: ci-pos-app-password-1234
      INTEGRATION_DATABASE_URL: postgres://pos_app:ci-pos-app-password-1234@localhost:5432/pos
      # Admin panel (migration 012): same throwaway-database rule; none of these are real credentials.
      ADMIN_APP_PASSWORD: ci-admin-app-password-1234
      INTEGRATION_ADMIN_DATABASE_URL: postgres://admin_app:ci-admin-app-password-1234@localhost:5432/pos
      INTEGRATION_SUPERUSER_URL: postgres://postgres:ci-admin-password@localhost:5432/pos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run migrations (fresh database)
        run: npm run db:migrate

      - name: Re-run migrations (must be a no-op)
        run: npm run db:migrate

      - name: Integration tests as pos_app (RLS applies)
        run: npm run test:integration

  supabase-edge:
    name: Supabase Edge Function build (Deno)
    runs-on: ubuntu-latest
    needs: test
    env:
      # প্লেসহোল্ডার: এই যাচাই ডাটাবেস ছোঁয় না।
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      # Placeholders that open the admin feature gate so the smoke test proves the admin routes are in the bundle (§17.6).
      ADMIN_JWT_SECRET: ci-only-admin-jwt-secret-not-used-anywhere
      ADMIN_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      ADMIN_TOTP_ENC_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the Edge Function bundle
        run: node edge/build.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the bundle in Deno
        run: deno run -A edge/smoke-test.mjs

  deploy:
    name: Deploy API to Supabase
    runs-on: ubuntu-latest
    # শুধু main এ push হলে, এবং টেস্ট ও Edge বিল্ড পাস করার পর।
    needs: [test, postgres, supabase-edge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # নতুন push অর্ধেক ডিপ্লয় বাতিল না করে অপেক্ষা করে।
    concurrency:
      group: deploy-supabase
      cancel-in-progress: false
    env:
      # Settings -> Secrets and variables -> Actions এ SUPABASE_ACCESS_TOKEN যোগ করুন।
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip notice
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN secret সেট নেই, তাই অটো-ডিপ্লয় বাদ গেল।"

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22

      - name: Install dependencies
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci --no-audit --no-fund

      - name: Build the Edge Function bundle
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node edge/build.mjs

      - name: Deploy the "api" function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PROJECT_REF="$(tr -d '[:space:]' < supabase-project-id.txt)"
          if [ "$PROJECT_REF" = "REPLACE_WITH_SUPABASE_PROJECT_REF" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error title=Supabase deploy::supabase-project-id.txt এ আসল Project ID বসানো হয়নি"
            exit 1
          fi
          npx --yes supabase@2 --version
          set +e
          npx --yes supabase@2 functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Supabase deploy::$(tail -c 900 deploy.log | tr '\r\n' '  ')"
            exit "$status"
          fi

      - name: Check the live API
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PROJECT_REF="$(tr -d '[:space:]' < supabase-project-id.txt)"
          for i in 1 2 3 4 5; do
            BODY="$(curl -s "https://$PROJECT_REF.supabase.co/functions/v1/api/health" || true)"
            echo "$BODY"
            echo "$BODY" | grep -q '"status":"ok"' && exit 0
            sleep 5
          done
          echo "::error title=Deploy check::লাইভ API /health এ status ok দেয়নি"
          exit 1
